# ── Gradle daemon & execution ────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true
# disableMemoryMapping stops the JVM mmapping jars/zips. On Windows a mapped file stays locked
# after the reader closes it, so a later clean or dependency swap fails with "cannot delete".
# This is a live platform workaround, not a version-compatibility bypass.
# ── Build speed ───────────────────────────────────────────────────────────────
#
# The configuration cache skips re-running the build scripts when nothing about
# them changed, which on an 18-module project is most of what an up-to-date
# build spends its time on. Gradle has been printing the suggestion on every
# invocation of this project.
#
# It is the one flag here that can FAIL a build rather than just slow it: a
# plugin that reads mutable state at execution time is rejected instead of
# quietly producing a wrong result. That is the point — but it means a plugin
# upgrade can surface a new error here, and the fix is the plugin, not turning
# this off.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# 2048m was the setting on a machine with 30GB. Kotlin and KSP across eighteen
# modules spend real time in GC at that heap; this is headroom, not a target.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding\=UTF-8 -Dsun.zip.disableMemoryMapping\=true -Djdk.nio.zipfs.disableMemoryMapping\=true

# ── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Encoding ─────────────────────────────────────────────────────────────────
# Pin the daemon's charset and locale so builds are byte-identical regardless of the
# machine's system locale.
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US
