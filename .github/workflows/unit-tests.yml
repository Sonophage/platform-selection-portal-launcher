name: Unit tests

# Guards against unit-test drift: assembleDebug skips unit tests, so broken tests (a stale fake that
# stops implementing an interface that grew, or a ViewModel refactor that outpaces its test) can land
# unnoticed. This runs every module's JVM unit tests on each push/PR. Nothing here needs an aar, an
# NDK or a device.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-unit-tests:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a repointed release tag can't inject code into CI.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # No later step needs git auth — don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run JVM unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
